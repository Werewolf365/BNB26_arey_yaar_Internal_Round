services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quorum
      POSTGRES_PASSWORD: quorum
      POSTGRES_DB: quorum
    # Host port 5433: 5432 is commonly taken by a machine-local PostgreSQL.
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quorum -d quorum"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    # Opt-in S3-compat backend: `--profile s3` (needs registry access to
    # pull minio/minio). Default stack uses the filesystem blob backend
    # (same key/error contract) so `up` needs no extra image.
    # `docker compose -f infra/compose/docker-compose.yml --profile s3 up --build -d`
    # plus QUORUM_S3_ENDPOINT=http://minio:4566 selects it (see api env below).
    image: minio/minio:latest
    profiles: ["s3"]
    command: ["server", "/data", "--address", ":4566"]
    environment:
      MINIO_ROOT_USER: test
      MINIO_ROOT_PASSWORD: ${QUORUM_S3_SECRET_KEY:-test12345}
    ports: ["4566:4566"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/minio/health/live || wget -qO- http://localhost:4566/minio/health/live > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
  anvil:
    # Real chain for anchor tests when daemon is up; optional (BLOCKCHAIN_REQUIRED=false).
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--port", "8545"]
    ports: ["8545:8545"]
  api:
    # Quorum REST API. One-command stack:
    # `docker compose -f infra/compose/docker-compose.yml up --build -d`
    # brings up postgres + anvil + api + web. Override host ports when busy:
    # QUORUM_API_PORT=18080 QUORUM_WEB_PORT=13000 docker compose ... up --build -d
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      QUORUM_ADDR: ":8080"
      QUORUM_DATABASE_URL: postgres://quorum:quorum@postgres:5432/quorum?sslmode=disable
      # Empty (default) = filesystem blobs at QUORUM_BLOB_DIR (same contract).
      # For S3: start with `--profile s3` and export
      # QUORUM_S3_ENDPOINT=http://minio:4566 (plus BUCKET/REGION/KEYS below).
      QUORUM_S3_ENDPOINT: ${QUORUM_S3_ENDPOINT:-}
      QUORUM_S3_BUCKET: ${QUORUM_S3_BUCKET:-quorum-evidence}
      QUORUM_S3_REGION: ${QUORUM_S3_REGION:-us-east-1}
      QUORUM_S3_ACCESS_KEY: ${QUORUM_S3_ACCESS_KEY:-test}
      QUORUM_S3_SECRET_KEY: ${QUORUM_S3_SECRET_KEY:-test12345}
      QUORUM_S3_PATH_STYLE: ${QUORUM_S3_PATH_STYLE:-"true"}
      QUORUM_BLOB_DIR: /data/evidence
      QUORUM_API_KEYS: ${QUORUM_API_KEYS:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      QUORUM_CORS_ORIGINS: ${QUORUM_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports: ["${QUORUM_API_PORT:-8080}:8080"]
    volumes: [evidencedata:/data/evidence]
    restart: unless-stopped
  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8080}
    depends_on:
      - api
    ports: ["${QUORUM_WEB_PORT:-3000}:3000"]
    restart: unless-stopped
  worker:
    # Opt-in: needs the host Docker socket for isolated rebuilds.
    # `docker compose -f infra/compose/docker-compose.yml --profile worker up --build -d worker`
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    profiles: ["worker"]
    depends_on:
      - api
    volumes: [/var/run/docker.sock:/var/run/docker.sock]
    command: ["--api", "http://api:8080", "--owner", "worker-1"]
volumes:
  pgdata:
  miniodata:
  evidencedata:
